# Keep the database small: record only temperature, humidity and CO2 of the monitors.
# Adjust the device names (here: woonkamer, slaapkamer) to yours.
recorder:
  include:
    entities:
      - sensor.woonkamer_temperature
      - sensor.woonkamer_humidity
      - sensor.woonkamer_carbon_dioxide
      - sensor.slaapkamer_temperature
      - sensor.slaapkamer_humidity
      - sensor.slaapkamer_carbon_dioxide
  exclude:
    entity_globs:
      - sensor.*_extra_data
      - sensor.*_wifi_signal

# Note: logbook.exclude does not apply on device pages. There is no "Last seen"
# sensor; Status only changes on a real transition and its last_reported holds
# the time of the last message.
